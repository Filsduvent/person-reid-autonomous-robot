# Qualification smoke and benchmark configuration: OSNet x0.5 via ONNX Runtime.
source: video
video_path: data/qualification_sequences/qualificationsequence1.mp4
device: cpu
output_dir: exp/qualification_runtime
run_name: osnet_x0_5_onnx
max_frames: 1227
warmup_frames: 30
print_every: 10
cuda_sync: false
detector: yolo26
yolo_model: edge_reid_runtime/weights/yolo26/yolo26n.pt
det_conf: 0.35
det_iou: 0.70
imgsz: 640
max_det: 100
max_age: 30
n_init: 3
max_iou_distance: 0.70
reid_backbone: osnet_x0_5
embedder_backend: onnx
weights: edge_reid_runtime/weights/onnx/osnet_x0_5.onnx
gallery_path: null
reset_gallery: true
save_video: false
display: false
known_threshold: 0.55
unknown_threshold: 0.45
max_identities: 500
id_prefix: person_
id_width: 4
update_threshold: 0.65
margin_threshold: 0.15
stable_age: 10
stable_hits: 5
min_det_conf: 0.35
area_drop_ratio: 0.5
aspect_ratio_min: 0.2
aspect_ratio_max: 0.9
ema_alpha: 0.1
reacquire_cooldown_frames: 15
